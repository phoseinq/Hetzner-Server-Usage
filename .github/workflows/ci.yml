name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Config.validate() runs on import; the checks never reach the API
      TELEGRAM_TOKEN: ci
      HETZNER_API_TOKEN: ci
      ADMIN_ID: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Everything compiles
        run: python -m compileall -q .
      - name: Self-checks
        run: |
          python utils.py
          python price_store.py
          python overage_tracker.py
          python server_manager.py
